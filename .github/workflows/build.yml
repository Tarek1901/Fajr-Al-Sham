name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Prepare Code & Configure Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. حقن ملف Google Services إذا كان موجوداً
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          
          # 2. تعديل minSdkVersion إلى 21 وتفعيل multiDex لتوافق Firebase
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/multiDexEnabled .*/multiDexEnabled true/g' android/app/build.gradle
          fi
          
          # 3. إصلاح مسارات الاستيرادات المطلقة من FlutterFlow
          find lib/ -type f -name "*.dart" -exec sed -i "s|import '/|import 'package:fajr_al_sham/|g" {} +
          
          # 4. تنزيل الحزم
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
