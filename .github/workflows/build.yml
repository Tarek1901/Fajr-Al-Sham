name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Prepare Code and Fix Imports
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter create . --platforms=android --project-name fajr_al_sham
          
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle

          mkdir -p lib/flutter_flow
          cat << 'EOF' > lib/flutter_flow/global_fixes.dart
          import 'package:flutter/material.dart';

          extension StateFixes<T extends StatefulWidget> on State<T> {
            void safeSetState(VoidCallback fn) {
              if (mounted) {
                // ignore: invalid_use_of_protected_member
                setState(fn);
              }
            }

            Widget wrapWithModel({
              required dynamic model,
              required Widget child,
              required VoidCallback updateCallback,
              bool updateCallbackOnDispose = false,
            }) {
              return child;
            }
          }
          EOF

          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons -t lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
