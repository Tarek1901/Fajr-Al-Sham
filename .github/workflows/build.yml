name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Prepare Code and Inject Core Utilities
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter create . --platforms=android --project-name fajr_al_sham
          
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          
          # 1. إصلاح الاستيرادات المطلقة
          find lib/ -type f -name "*.dart" -exec sed -i 's|import '\''/|import '\''package:fajr_al_sham/|g' {} +

          # 2. إنشاء ملف تعريف شامل لكل دوال FlutterFlow المفقودة وإضافته لـ main.dart
          mkdir -p lib/flutter_flow
          cat << 'EOF' > lib/flutter_flow/global_fixes.dart
          import 'package:flutter/material.dart';

          extension StateFixes<T extends StatefulWidget> on State<T> {
            void safeSetState(VoidCallback fn) {
              if (mounted) {
                // ignore: invalid_use_of_protected_member
                setState(fn);
              }
            }

            Widget wrapWithModel({
              required dynamic model,
              required Widget child,
              required VoidCallback updateCallback,
              bool updateCallbackOnDispose = false,
            }) {
              return child;
            }
          }
          EOF

          # 3. إجبار استيراد global_fixes.dart في رأس جميع ملفات المشاريح
          find lib/ -type f -name "*.dart" -exec bash -c '
            for file; do
              echo "import '\''package:fajr_al_sham/flutter_flow/global_fixes.dart'\'';" | cat - "$file" > temp && mv temp "$file"
            done
          ' _ {} +

          # 4. إعداد الأيقونة
          IMAGE_PATH=""
          if [ -f app_logo.png.jpg ]; then
            IMAGE_PATH="app_logo.png.jpg"
          elif [ -f assets/images/app_logo.png.jpg ]; then
            IMAGE_PATH="assets/images/app_logo.png.jpg"
          elif [ -f assets/images/app_logo.png ]; then
            IMAGE_PATH="assets/images/app_logo.png"
          elif [ -f assets/images/app_logo.jpg ]; then
            IMAGE_PATH="assets/images/app_logo.jpg"
          elif [ -f app_logo.png ]; then
            IMAGE_PATH="app_logo.png"
          fi

          if [ -n "$IMAGE_PATH" ]; then
            flutter pub add dev:flutter_launcher_icons
            printf "\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  ios: false\n  image_path: \"%s\"\n  min_sdk_android: 21\n" "$IMAGE_PATH" >> pubspec.yaml
            dart run flutter_launcher_icons
          fi

          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons -t lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
