name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Prepare Code and Fix Imports
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter create . --platforms=android --project-name fajr_al_sham
          
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          
          # 1. تصحيح الاستيرادات والإنشاء الذكي للمكتبات المفقودة
          find lib/ -type f -name "*.dart" -exec sed -i 's|import '\''/|import '\''package:fajr_al_sham/|g' {} +
          find lib/ -type f -name "*.dart" -exec sed -i 's/safeSetState/if (mounted) setState/g' {} +
          
          # استيراد الأدوات الأساسية في جميع ملفات المكونات
          find lib/ -type f -name "*.dart" -exec sed -i '1s|^|import "package:fajr_al_sham/flutter_flow/flutter_flow_util.dart";\n|' {} +

          # 2. إعداد الأيقونة لأندرويد فقط لتفادي خطأ iOS
          IMAGE_PATH=""
          if [ -f app_logo.png.jpg ]; then
            IMAGE_PATH="app_logo.png.jpg"
          elif [ -f assets/images/app_logo.png.jpg ]; then
            IMAGE_PATH="assets/images/app_logo.png.jpg"
          elif [ -f assets/images/app_logo.png ]; then
            IMAGE_PATH="assets/images/app_logo.png"
          elif [ -f assets/images/app_logo.jpg ]; then
            IMAGE_PATH="assets/images/app_logo.jpg"
          elif [ -f app_logo.png ]; then
            IMAGE_PATH="app_logo.png"
          fi

          if [ -n "$IMAGE_PATH" ]; then
            flutter pub add dev:flutter_launcher_icons
            printf "\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  ios: false\n  image_path: \"%s\"\n  min_sdk_android: 21\n" "$IMAGE_PATH" >> pubspec.yaml
            dart run flutter_launcher_icons
          fi

          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --main=lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
