name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Prepare Code, Fix Imports & Configure Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. تحديث مجلد أندرويد
          flutter create . --platforms=android --project-name fajr_al_sham
          
          # 2. حقن ملف Google Services
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          
          # 3. تعديل minSdkVersion إلى 21 لتوافق Firebase
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          
          # 4. إصلاح جميع مسارات الاستيرادات المطلقة من FlutterFlow
          find lib/ -type f -name "*.dart" -exec sed -i "s|import '/|import 'package:fajr_al_sham/|g" {} +
          
          # 5. إصلاح استيرادات bottom_nav_widget بشكل خاص
          if [ -f lib/components/bottom_nav/bottom_nav_widget.dart ]; then
            sed -i '1i import '\''package:fajr_al_sham/flutter_flow/flutter_flow_util.dart'\'';' lib/components/bottom_nav/bottom_nav_widget.dart
            sed -i '1i import '\''package:fajr_al_sham/components/bottom_nav/nav_item/nav_item_widget.dart'\'';' lib/components/bottom_nav/bottom_nav_widget.dart
          fi
          
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
